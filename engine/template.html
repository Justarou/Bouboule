<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Mise en page : un lecteur au centre, puis réglages, export et fiches de publication en dessous. */
@font-face{font-family:"Baloo 2";font-weight:800;font-style:normal;src:url(data:font/woff2;base64,{{FONT}}) format("woff2")}
:root{--bg:#eaf3ff;--surface:#ffffff;--ink:#14213d;--muted:#51608a;--accent:#ff6a2b;--accent-ink:#ffffff;--line:#c9d8f2;--ok:#1d7a4a;--err:#b3261e;--stage:#0e1430;
--display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1430;--surface:#172046;--ink:#eef2ff;--muted:#a3b2e0;--accent:#ff8a4d;--accent-ink:#1a1020;--line:#2b3769;--ok:#6fdc9d;--err:#ff8f86;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1430;--surface:#172046;--ink:#eef2ff;--muted:#a3b2e0;--accent:#ff8a4d;--accent-ink:#1a1020;--line:#2b3769;--ok:#6fdc9d;--err:#ff8f86;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:20px}
h1{font:800 clamp(26px,5vw,40px)/1.05 var(--display);margin:0;text-wrap:balance}
.kicker{font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
.lead{color:var(--muted);margin:6px 0 0;max-width:62ch}
.stageBox{position:relative;margin:0 auto;background:var(--stage);border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(10,15,40,.25);max-width:100%}
.stageBox[data-mode="land"]{width:100%;aspect-ratio:16/9}
.stageBox[data-mode="port"]{height:min(78vh,720px);aspect-ratio:9/16;max-width:100%}
.stageBox svg{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 40%,rgba(10,15,40,.35))}
#play{font:800 clamp(18px,3.4vw,26px) var(--display);background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:.55em 1.4em;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#play:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.seg,.togs{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,#play:focus-visible,.dlbtn:focus-visible,.tab:focus-visible,.copy:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
section.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
h2{font:800 22px/1.1 var(--display);margin:0}
.dls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.dlbtn{display:grid;gap:2px;text-align:left;border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 16px;cursor:pointer}
.dlbtn b{font:800 18px var(--display)}.dlbtn small{opacity:.85}
.dlbtn:disabled{opacity:.55;cursor:progress}
#barWrap{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
#bar{height:100%;width:0;background:var(--accent)}
#status{min-height:1.4em;margin:0;color:var(--muted)}
#status[data-kind="err"]{color:var(--err)}#status[data-kind="ok"]{color:var(--ok)}
.note{color:var(--muted);font-size:14px;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{display:grid;text-align:left;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer;min-width:0}
.tab small{color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.field{display:grid;gap:6px;min-width:0}
.fhead{display:flex;justify-content:space-between;align-items:center;font:700 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.copy{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:4px 12px;cursor:pointer}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:10px;padding:12px;font:15px/1.5 var(--body)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="wrap">
  <header>
    <p class="kicker">{{SERIES}} · épisode {{NO}}</p>
    <h1>{{TITLE}}</h1>
    <p class="lead">{{LEAD}}</p>
  </header>

  <div class="stageBox" data-mode="land">
    <svg id="scene" viewBox="0 0 800 450" role="img" aria-label="{{ALT}}" preserveAspectRatio="xMidYMid slice"><g id="cam"></g></svg>
    <div id="overlay"><button id="play" type="button"><span id="playLabel">Lancer l’épisode</span></button></div>
  </div>

  <div class="bar">
    <div class="seg" role="group" aria-label="Format de l’image">
      <button class="chip" type="button" data-mode-btn="land" aria-pressed="true">Paysage 16:9</button>
      <button class="chip" type="button" data-mode-btn="port" aria-pressed="false">Vertical 9:16</button>
    </div>
    <div class="togs" role="group" aria-label="Sons">
      <button class="chip" id="tVoice" type="button" aria-pressed="true">Voix</button>
      <button class="chip" id="tMusic" type="button" aria-pressed="true">Musique</button>
      <button class="chip" id="tSfx" type="button" aria-pressed="true">Bruitages</button>
    </div>
  </div>

  <section class="panel" aria-labelledby="hExp">
    <h2 id="hExp">Télécharger la vidéo</h2>
    <div class="dls">
      <button class="dlbtn" id="dlLand" type="button"><b>MP4 paysage</b><small>1920 × 1080 · pour YouTube</small></button>
      <button class="dlbtn" id="dlPort" type="button"><b>MP4 vertical</b><small>1080 × 1920 · pour Shorts et TikTok</small></button>
    </div>
    <div id="barWrap" hidden><div id="bar"></div></div>
    <p id="status" role="status"></p>
    <p class="note">La vidéo est fabriquée dans ton navigateur (comptez 2 à 4 minutes) : laisse l’onglet ouvert pendant la création. Chrome ou Edge sur ordinateur recommandé.</p>
  </section>

  <section class="panel" aria-labelledby="hPub">
    <h2 id="hPub">Titres et descriptions</h2>
    <div class="tabs" id="pubTabs" role="tablist"></div>
    <div id="pubBody"></div>
  </section>
</div>

<script>{{MUXER}}</script>
<script>window.EP={{EP}};window.VOICE_B64={{VOICES}};window.SFX_B64={{SFX}};</script>
<script>{{CHARS}}</script>
<script>{{SETS}}</script>
<script>{{ENGINE}}</script>
<script>{{AUDIO}}</script>
<script>{{UI}}</script>
