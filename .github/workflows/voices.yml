name: Generation des voix

on:
  workflow_dispatch:        # bouton "Run workflow"
  push:
    paths:
      - "episodes/**"       # se lance dès qu'un nouvel épisode est ajouté
  schedule:
    - cron: "0 5 * * *"     # chaque jour vers 6h-7h (heure de Paris)

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generer les voix manquantes
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/generate.py
      - name: Enregistrer les mp3 dans le depot
        if: always()
        run: |
          git config user.name "voix-bot"
          git config user.email "voix-bot@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || (git commit -m "Nouvelles voix" && git push origin HEAD:${{ github.ref_name }})

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio
          path: audio
